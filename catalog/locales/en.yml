# English is the reference locale. Every other file in this directory must
# carry exactly these keys -- tests/test_i18n.py enforces that, so a new
# string added here fails the suite until all six languages have it.
#
# Interpolation uses named {placeholders}, never concatenation: word order
# differs across these languages and a placeholder has to be free to move
# within the sentence.
#
# Not translated on purpose (they stay English in every locale): the
# convergence ceiling warning, the archetype disclaimer, the cross-year
# warning, the disagreement callout, and the coverage grid caption. Those are
# nuanced statistical claims where a bad translation misleads rather than
# merely reads awkwardly.
version: 1
locale: en
name: English
direction: ltr

numbers:
  decimal: "."
  group: ","
  million: "M"
  list_separator: ", "

