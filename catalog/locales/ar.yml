# Arabic. Key set must match en.yml exactly (tests/test_i18n.py enforces).
# Indicator names follow UNSD's Arabic SDG terminology where it exists;
# needs native-speaker review before this is shown to a UN audience.
#
# direction: rtl triggers a stylesheet in app.py that flips text and layout.
# It does NOT flip the pydeck map, plotly axes or chart legends -- those stay
# left-to-right, and ui.rtl.notice says so on screen rather than pretending
# the support is complete.
#
# Digits stay Western (0-9) rather than Eastern Arabic (٠-٩): that is the
# convention in statistical publications and matches the underlying UN data.
version: 1
locale: ar
name: العربية
direction: rtl

numbers:
  decimal: "."
  group: ","
  million: "مليون"
  list_separator: "، "

