  info.need_two_indicators: >-
    Cette vue nécessite au moins deux indicateurs configurés pour ce thème ;
    un seul est disponible actuellement.
  info.need_date_range: >-
    Cette vue nécessite une plage de dates connue pour cet indicateur, qui
    n'est pas encore configurée.

