  source.prefix: "Source : {citation}"
  source.unit: "unité : {unit}"

  rtl.notice: >-
    Le texte s'affiche de droite à gauche. La carte et les graphiques ne sont
    pas inversés : ils se lisent toujours de gauche à droite.

  warn.no_indicators: "Aucun indicateur ne correspond à ce filtre thématique — essayez de l'effacer."
