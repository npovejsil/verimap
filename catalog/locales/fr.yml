  sidebar.compare: "Comparer avec"
  sidebar.compare_none: "(aucun)"
  sidebar.weights_header: "**Pondérations du score de priorité**"
  sidebar.weight_people: "Importance accordée : personnes concernées"
  sidebar.weight_stagnation: "Importance accordée : absence de progrès"

  tab.map: "Carte"
