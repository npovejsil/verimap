# French. Key set must match en.yml exactly (tests/test_i18n.py enforces).
# Indicator names follow UNSD's French SDG terminology where it exists;
# needs native-speaker review before this is shown to a UN audience.
version: 1
locale: fr
name: Français
direction: ltr

numbers:
  decimal: ","
  group: " "
  million: "M"
  list_separator: ", "

ui:
  app.title: "Tableau de bord inter-agences des ODD de l'ONU"
  app.caption: >-
    Une recette réutilisable pour récupérer, valider et associer des
    indicateurs de différentes agences de l'ONU — sans code nouveau par
    indicateur.

  sidebar.language: "Langue"
