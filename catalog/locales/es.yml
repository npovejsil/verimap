# Spanish. Key set must match en.yml exactly (tests/test_i18n.py enforces).
# Indicator names follow UNSD's Spanish SDG terminology where it exists;
# needs native-speaker review before this is shown to a UN audience.
version: 1
locale: es
name: Español
direction: ltr

numbers:
  decimal: ","
  group: "."
  million: "M"
  list_separator: ", "

