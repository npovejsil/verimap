# Russian. Key set must match en.yml exactly (tests/test_i18n.py enforces).
# Indicator names follow UNSD's Russian SDG terminology where it exists;
# needs native-speaker review before this is shown to a UN audience.
version: 1
locale: ru
name: Русский
direction: ltr

numbers:
  decimal: ","
  group: " "
  million: "млн"
  list_separator: ", "

ui:
