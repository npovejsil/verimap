# Unit -> family mapping. Same family = safe to compare/plot on shared axes.
# Different family = arithmetic across them is blocked by the key-matcher.
#
# Verified live: SDG uses "Percent" while WHO uses the raw
# "undata/UNIT_MEASURE-PT_POP" facet id for the same 0-100 percent scale.
# Without this mapping the two would be flagged incomparable.
families:
  percent:
    members:
      - Percent
      - undata/UNIT_MEASURE-PT_POP
      - undata/UNIT_MEASURE-PT_POP_U
      - undata/UNIT_MEASURE-PT_POP_R
    display: "%"
    arithmetic: same_scale

  count_persons:
    members:
      - undata/UNIT_MEASURE-COUNT_PERSONS
    display: persons
    arithmetic: additive

  power_per_capita:
    members:
      - undata/UNIT_MEASURE-RATIO_POWER_W_PER_POP
    display: watts per capita
    arithmetic: ratio_no_sum

  energy_intensity:
    members:
      - undata/UNIT_MEASURE-RATIO_ENERGY_MJ_PER_CR_USD_PPP2011
    display: MJ per constant 2011 USD PPP
    arithmetic: ratio_no_sum

  index:
    members:
      - Index
    display: index
    arithmetic: ratio_no_sum

  # The World Bank percentages below get their own families ON PURPOSE. The
  # key-matcher treats same-family units as safe to subtract, and "% of
  # electricity output" shares no denominator with "% of population" -- a
  # country can lose 18% of its output while 98% of its people have access.
  # Splitting them makes compute_join_spec return "axes_only" for that pair, so
  # the app plots them side by side but refuses to compute a difference.
  # Rural and urban access deliberately stay in `percent` together, because
  # each is a share of its own base and urban minus rural IS the access gap.
  percent_of_output:
    members:
      - worldbank/PCT_OUTPUT
    display: "% of output"
    arithmetic: ratio_no_sum

  percent_of_firms:
    members:
      - worldbank/PCT_FIRMS
    display: "% of firms"
    arithmetic: ratio_no_sum

  kwh_per_capita:
    members:
      - worldbank/KWH_PER_CAPITA
    display: kWh per capita
    arithmetic: ratio_no_sum
