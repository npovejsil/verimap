# Hand-authored catalog entries. Adding a new indicator here (then running
# `make enrich`) is the whole "no new code" story: three required fields plus
# optional human judgment the API cannot supply. Everything else -- unit,
# temporal range, place coverage, provenance -- is filled in by
# scripts/discover_indicators.py --enrich into catalog/discovered.yml.
#
# target_value/target_year are optional and only set where the SDG target is
# a fixed number everyone converges on (e.g. "universal access" == 100% by
# 2030). Targets phrased as "substantially increase" or "double the rate"
# have no single numeric value, so those indicators are left without one --
# the Progress tab shows their trend without a target line rather than
# inventing a number.
version: 1
indicators:
  sdg_elec_access:
    dcid: undata/sdg/EG_ACS_ELEC
    label: Electricity access
    topics: [energy_access]
    polarity: higher_is_better
    sdg_target: "7.1"
    saturation_ceiling: 100
    denominator: unicef_population
    target_value: 100
    target_year: 2030

  sdg_renew_capacity:
    dcid: undata/sdg/EG_EGY_RNEW
    label: Installed renewable capacity
    topics: [energy_supply]
    polarity: higher_is_better
    sdg_target: "7.2"

  sdg_renew_share:
    dcid: undata/sdg/EG_FEC_RNEW
    label: Renewable share of energy consumption
    topics: [energy_supply]
    polarity: higher_is_better
    sdg_target: "7.2"

  sdg_energy_intensity:
    dcid: undata/sdg/EG_EGY_PRIM
    label: Energy intensity of primary energy
    topics: [energy_supply]
    polarity: lower_is_better
    sdg_target: "7.3"

  who_clean_cooking:
    dcid: undata/who/COOKFUEL_PROP.COOK_FUEL--CLEAN
    label: Clean cooking fuel reliance
    topics: [energy_access]
    polarity: higher_is_better
    sdg_target: "7.1"
    saturation_ceiling: 100
    target_value: 100
    target_year: 2030

  sdg_safe_water:
    dcid: undata/sdg/SH_H2O_SAFE
    label: Safely managed drinking water
    topics: [water_sanitation]
    polarity: higher_is_better
    sdg_target: "6.1"
    saturation_ceiling: 100
    target_value: 100
    target_year: 2030

  sdg_forest_area:
    dcid: undata/sdg/AG_LND_FRST
    label: Forest area (% of land)
    topics: [land_forests]
    polarity: higher_is_better
    sdg_target: "15.1"

  unicef_population:
    dcid: undata/unicef/DM_POP
    label: Total population
    topics: [_denominators]
    polarity: neutral
    role: denominator

  worldbank_elec_access:
    dcid: worldBank/EG_ELC_ACCS_ZS
    label: Electricity access (World Bank)
    topics: [energy_access]
    polarity: higher_is_better
    saturation_ceiling: 100
    target_value: 100
    target_year: 2030

  # Rural and urban access both live in the `percent` unit family: each is a
  # share of its OWN base population, so `urban - rural` is a meaningful access
  # gap. Contrast with transmission losses (% of output) and outages (% of
  # firms), which get their own families precisely so the key-matcher refuses
  # to subtract them from a share-of-population figure.
  wb_elec_access_rural:
    dcid: worldBank/EG_ELC_ACCS_RU_ZS
    label: Electricity access, rural
    topics: [energy_access]
    polarity: higher_is_better
    saturation_ceiling: 100

  wb_elec_access_urban:
    dcid: worldBank/EG_ELC_ACCS_UR_ZS
    label: Electricity access, urban
    topics: [energy_access]
    polarity: higher_is_better
    saturation_ceiling: 100

  # --- Direct World Bank API pulls -------------------------------------------
  # These four are NOT in the UN Data Commons instance (verified against
  # /api/variable/info), which is the whole reason recipe/worldbank_client.py
  # exists. Units are declared by hand because the World Bank API reports
  # unit="" on every observation.

  wb_transmission_losses:
    dcid: worldbank/EG.ELC.LOSS.ZS
    label: Transmission & distribution losses
    topics: [energy_delivery]
    polarity: lower_is_better
    source: world_bank
    unit: worldbank/PCT_OUTPUT
    unit_display: "% of output"

  wb_firm_outages:
    dcid: worldbank/IC.ELC.OUTG.ZS
    label: Firms experiencing power outages
    topics: [energy_delivery]
    polarity: lower_is_better
    source: world_bank
    unit: worldbank/PCT_FIRMS
    unit_display: "% of firms"

  wb_elec_consumption_pc:
    dcid: worldbank/EG.USE.ELEC.KH.PC
    label: Electricity consumption per capita
    topics: [energy_supply]
    polarity: neutral
    source: world_bank
    unit: worldbank/KWH_PER_CAPITA
    unit_display: kWh per capita

  wb_renew_output:
    dcid: worldbank/EG.ELC.RNEW.ZS
    label: Renewable share of electricity output
    topics: [energy_supply]
    polarity: higher_is_better
    source: world_bank
    unit: worldbank/PCT_OUTPUT
    unit_display: "% of output"
